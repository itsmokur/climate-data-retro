<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Board</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236d4c41'/><text x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' text-anchor='middle' fill='white'>G</text></svg>">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,700;1,300&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- WELCOME MODAL -->
  <div class="modal-overlay" id="welcomeModal">
    <div class="modal">
      <h2>Welcome to the Retro 👋</h2>
      <p>Enter your name to join. Everyone can access the same board by sharing the link.</p>
      <input class="modal-input" id="welcomeNameInput"
        placeholder="Your name (e.g. Alex, Milton, Igor, Marick, or Mert)" maxlength="30" />
      <div class="modal-actions">
        <button class="btn-primary" id="joinBtn">Join →</button>
      </div>
    </div>
  </div>

  <!-- SHARE MODAL -->
  <div class="modal-overlay" id="shareModal" style="display:none">
    <div class="modal">
      <h2>Share this Retro 🔗</h2>
      <p>Share this link with your team. Everyone can join directly.</p>
      <div class="share-url" id="shareUrlDisplay"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn-ghost" onclick="closeShare()">Close</button>
        <button class="btn-share" onclick="copyShareUrl()">📋 Copy Link</button>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="logo">Retro<span>.</span></div>
    <input class="retro-name-input" id="retroTitle" placeholder="Retro title..." value="Sprint Retrospective #1" />
    <div class="header-spacer"></div>
    <div class="sync-dot" id="syncDot"></div>
    <span class="sync-label" id="syncLabel">Live</span>
    <span class="sync-label" id="presenceLabel" title="">0 online</span>
    <button class="btn-ghost" style="font-size:12px" onclick="openShare()">🔗 Share</button>
    <div class="user-section">
      <div class="user-avatar" id="userAvatarEl">?</div>
    </div>
  </header>

  <!-- PHASE BAR -->
  <div class="phase-bar">
    <button class="phase-btn active" onclick="setPhase(0)">✍️ Reflect</button>
    <div class="phase-divider"></div>
    <button class="phase-btn" onclick="setPhase(1)">👍 Vote</button>
    <div class="phase-divider"></div>
    <button class="phase-btn" onclick="setPhase(2)">💬 Discuss</button>
    <div class="phase-divider"></div>
    <button class="phase-btn" onclick="setPhase(3)">✅ Actions</button>
  </div>

  <!-- TIMER BAR -->
  <div class="timer-bar">
    <span class="timer-label">⏱ TIMER</span>
    <div class="timer-display" id="timerDisplay">05:00</div>
    <div class="timer-controls">
      <button class="timer-preset" onclick="setTimer(3)">3m</button>
      <button class="timer-preset" onclick="setTimer(5)">5m</button>
      <button class="timer-preset" onclick="setTimer(10)">10m</button>
      <button class="timer-preset" onclick="setTimer(15)">15m</button>
      <button class="timer-btn" id="timerStartBtn" onclick="toggleTimer()">▶</button>
      <button class="timer-btn" onclick="resetTimer()" title="Reset">↺</button>
    </div>
    <div class="timer-spacer"></div>
    <span class="timer-label" id="timerPhaseLabel">Reflect phase</span>
  </div>

  <!-- MAIN BOARD -->
  <main>
    <div class="board" id="board"></div>
  </main>

  <div class="toast-container" id="toastContainer"></div>
  <script type='module' src="script.js"></script>
</body>

</html>
